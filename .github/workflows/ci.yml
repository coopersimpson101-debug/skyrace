name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (python port, ${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    env:
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  sitl:
    name: SITL against the real skyforge-fc C code (gcc)
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: coopersimpson101-debug/skyforge-fc
          path: skyforge-fc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: CC=gcc python scripts/build_sitl.py --skyforge-fc skyforge-fc
      - name: conformance (CRC, channel packing, rate curve, mixer, PID) + closed-loop laps on the C FC
        run: python -m pytest -q tests/test_crsf.py tests/test_fc_port.py tests/test_closed_loop.py
      - name: one closed-loop lap with CNN vision and MPC on the C FC
        run: python scripts/run_race.py --quick --backend sitl

  docs:
    name: relative links + script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_links.py
      - run: python -m py_compile docs/assets/make_figures.py scripts/*.py
