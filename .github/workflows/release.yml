name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for"
        required: true
permissions:
  contents: write
jobs:
  dist:
    name: sdist + wheel (includes the trained GateNet weights)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - run: pip install dist/*.whl pytest && python -m pytest -q tests/test_vision.py
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/* }

  sitl:
    name: SITL shared library (linux x86_64, built against skyforge-fc main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/checkout@v4
        with:
          repository: coopersimpson101-debug/skyforge-fc
          path: skyforge-fc
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: CC=gcc python scripts/build_sitl.py --skyforge-fc skyforge-fc --out out/skyrace_sitl-linux-x86_64.so
      - uses: actions/upload-artifact@v4
        with: { name: sitl, path: out/* }

  publish:
    needs: [dist, sitl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: .github/release/${{ github.event.inputs.tag || github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            artifacts/dist/*
            artifacts/sitl/*
